# TODO: after_sleep_cmd and on-resume below dropped their
# `keystone-dpms-wake || (...)` wrapper on 2026-08-01 to observe baseline wake
# behavior without the wedged-connector watchdog; restore both if DP-1 wedges
# again. Canonical form: ks.systems/desktop templates/hyprland hypridle.conf.
general {
  after_sleep_cmd=hyprctl dispatch dpms on && brightnessctl -r
  before_sleep_cmd=pidof hyprlock || hyprlock
  ignore_dbus_inhibit=true
  inhibit_sleep=3
  lock_cmd=pidof hyprlock || hyprlock
}

listener {
  on-timeout=pidof hyprlock || hyprlock
  timeout=300
}

listener {
  on-resume=hyprctl dispatch dpms on && brightnessctl -r
  on-timeout=hyprctl dispatch dpms off
  timeout=330
}
