# The keystone-dpms-wake wrapper was dropped 2026-08-01 to observe baseline wake
# behavior; DP-1 wedged twice that same day, so it is restored per that TODO.
# Canonical form: ks.systems/desktop templates/hyprland hypridle.conf.
general {
  after_sleep_cmd=keystone-dpms-wake || (hyprctl dispatch dpms on && brightnessctl -r)
  before_sleep_cmd=keystone-lock --fail-closed
  ignore_dbus_inhibit=true
  inhibit_sleep=3
  lock_cmd=keystone-lock
}

listener {
  on-timeout=keystone-lock
  timeout=300
}

listener {
  on-resume=keystone-dpms-wake || (hyprctl dispatch dpms on && brightnessctl -r)
  on-timeout=hyprctl dispatch dpms off
  timeout=330
}
