# ncrmro personal Hyprland overlay. Home Manager sources this file last so the
# entries append to Keystone's generated configuration.

exec-once = hyprctl dispatch workspace 2

windowrule = tag +messaging, match:class Signal
windowrule = tag +messaging, match:title .*WhatsApp.*
windowrule = tag +messaging, match:class discord
windowrule = tag +messaging, match:class telegram

windowrule = no_screen_share on, match:tag messaging
windowrule = workspace special:magic, match:tag messaging

windowrule = workspace special:magic, match:title .*YouTube Music.*
